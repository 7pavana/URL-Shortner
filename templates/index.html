<!DOCTYPE html>
<html lang="en">
<head>
    <title>URL Shortener</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 20px;
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
        }

        .history {
            margin-top: 20px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        .history a {
            display: block;
            color: #667eea;
            margin-bottom: 5px;
        }

        .copy-btn {
            background: #28a745;
        }

        .copy-btn:hover {
            background: #218838;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🔗 URL Shortener</h2>

    <form method="POST">
        <input type="text" name="url" placeholder="Enter your long URL" required>
        <br>
        <button type="submit">Shorten URL</button>
    </form>

    {% if short_url %}
    <div class="result">
        <p><b>Short URL:</b></p>
        <a href="{{ short_url }}" target="_blank" id="shortLink">{{ short_url }}</a>
        <br><br>
        <button class="copy-btn" onclick="copyLink()">Copy</button>
    </div>
    {% endif %}

    <div class="history">
        <h4>Recent Links</h4>
        {% if history %}
            {% for item in history %}
                <a href="{{ item.short }}" target="_blank">{{ item.short }}</a>
            {% endfor %}
        {% else %}
            <p>No links yet</p>
        {% endif %}
    </div>
</div>

<script>
function copyLink() {
    const link = document.getElementById("shortLink").innerText;
    navigator.clipboard.writeText(link);
    alert("Copied to clipboard!");
}
</script>

</body>
</html>
